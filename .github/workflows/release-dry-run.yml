name: Validate unified release dry run

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact lowercase 40-character source commit SHA
        required: true
        type: string
      package_version:
        description: Exact Cargo package version at the accepted commit
        required: true
        type: string
      lockfile_sha256:
        description: Exact lowercase SHA-256 of Cargo.lock at the accepted commit
        required: true
        type: string
      prerelease_tag:
        description: Optional controlled tag v<package-version>-rc.<positive integer>
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release-dry-run.yml
      - .github/actions/dashboard-browser-lane/action.yml
      - Cargo.lock
      - Cargo.toml
      - scripts/dashboard_candidate_runtime.py
      - scripts/dashboard_browser_evidence.py
      - scripts/dashboard_evidence.py
      - scripts/dashboard_release_browser.py
      - scripts/release_dry_run_summary.py
      - scripts/release_identity.py
      - scripts/release_command_evidence.py
      - scripts/release_prerelease.py
      - scripts/release_quality_evidence.py
      - src/dashboard.rs
      - src/dashboard_assets/**
      - src/dashboard_finance.rs
      - src/dashboard_view.rs
      - tests/dashboard_browser_evidence.py
      - tests/release_dry_run.py
      - tests/release_command_evidence.py
      - tests/release_prerelease.py
      - tests/release_quality_evidence.py

permissions:
  actions: read
  contents: read

concurrency:
  group: release-dry-run
  cancel-in-progress: false

jobs:
  identity:
    name: Bind the release identity and target matrix
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.values.outputs.source_sha }}
      package_version: ${{ steps.values.outputs.package_version }}
      lockfile_sha256: ${{ steps.values.outputs.lockfile_sha256 }}
      matrix: ${{ steps.values.outputs.matrix }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.accepted_sha || github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Validate dispatched identity
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
          LOCKFILE_SHA256: ${{ inputs.lockfile_sha256 }}
          PACKAGE_VERSION: ${{ inputs.package_version }}
        run: |
          python3 scripts/release_identity.py \
            --accepted-sha "$ACCEPTED_SHA" \
            --package-version "$PACKAGE_VERSION" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --output release-identity.json
      - name: Record pull-request identity
        if: ${{ github.event_name == 'pull_request' }}
        run: python3 scripts/release_identity.py --derive --output release-identity.json
      - name: Expose the immutable identity and supported targets
        id: values
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("release-identity.json", encoding="utf-8"))
          matrix = {
              "include": [
                  {"runner": "macos-14", "target": "aarch64-apple-darwin"},
                  {"runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
              ]
          }
          print("source_sha=" + value["source_sha"])
          print("package_version=" + value["package_version"])
          print("lockfile_sha256=" + value["lockfile_sha256"])
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY
      - name: Retain the accepted identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-identity-${{ steps.values.outputs.source_sha }}
          path: release-identity.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Preserved release quality gates
    needs: identity
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Install frozen Rust with Clippy and rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-identity-${{ needs.identity.outputs.source_sha }}
      - name: Enforce dependency and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources
      - name: Run preserved quality gates and record their exact commands
        run: |
          python3 scripts/release_quality_evidence.py \
            --identity release-identity.json \
            --output quality-evidence.json
      - name: Retain successful quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-quality-evidence-${{ needs.identity.outputs.source_sha }}
          path: quality-evidence.json
          if-no-files-found: error
          retention-days: 14

  build-native:
    name: Build once (${{ matrix.target }})
    needs: identity
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-identity-${{ needs.identity.outputs.source_sha }}
      - name: Install frozen Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Cargo Dist 0.32.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output cargo-dist-installer.sh \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          echo 'b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  cargo-dist-installer.sh' \
            | shasum -a 256 --check
          sh cargo-dist-installer.sh
      - name: Build once and retain the exact successful commands
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          LOCKFILE_SHA256: ${{ needs.identity.outputs.lockfile_sha256 }}
          PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          COMMAND_LOG="$PWD/native-build-commands.txt"
          : > "$COMMAND_LOG"
          record_and_run() {
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '\n' >> "$COMMAND_LOG"
            "$@"
          }
          record_and_run_to() {
            local output="$1"
            shift
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '> %q\n' "$output" >> "$COMMAND_LOG"
            "$@" > "$output"
          }
          record_and_run dist build --artifacts=local "--target=$TARGET"
          record_and_run_to dist-manifest.json \
            dist manifest --artifacts=local --no-local-paths \
            "--target=$TARGET" --output-format=json
          record_and_run bash -c \
            "cd target/distrib && shasum -a 256 --check 'tracky-$TARGET.tar.xz.sha256'"
          record_and_run python3 scripts/dashboard_evidence.py semantic-manifest \
            --archive "target/distrib/tracky-$TARGET.tar.xz" \
            --target "$TARGET" \
            --source-sha "$ACCEPTED_SHA" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --cargo-dist-manifest dist-manifest.json \
            --package-version "$PACKAGE_VERSION" \
            --rust-version "$(rustc --version)" \
            --cargo-version "$(cargo --version)" \
            --cargo-dist-version "$(dist --version)" \
            --output semantic-manifest.json
          python3 scripts/release_command_evidence.py \
            --identity release-identity.json \
            --job-type native-build \
            --target "$TARGET" \
            --commands-file "$COMMAND_LOG" \
            --output native-build-evidence.json
      - name: Assemble the immutable native bundle
        run: |
          mkdir release-bundle
          cp release-identity.json dist-manifest.json semantic-manifest.json \
            native-build-evidence.json release-bundle/
          cp "target/distrib/tracky-${{ matrix.target }}.tar.xz" release-bundle/
          cp "target/distrib/tracky-${{ matrix.target }}.tar.xz.sha256" release-bundle/
      - name: Retain publication-ready native inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 14

  package-runtime:
    name: Reuse and test (${{ matrix.target }})
    needs: [identity, build-native]
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-identity-${{ needs.identity.outputs.source_sha }}
          path: expected
      - name: Install frozen Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Download the exact built artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: candidate
      - name: Verify and exercise the package with retained exact commands
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          COMMAND_LOG="$PWD/native-runtime-commands.txt"
          : > "$COMMAND_LOG"
          record_and_run() {
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '\n' >> "$COMMAND_LOG"
            "$@"
          }
          record_and_run cmp \
            expected/release-identity.json candidate/release-identity.json
          record_and_run bash -c \
            "cd candidate && shasum -a 256 --check 'tracky-$TARGET.tar.xz.sha256'"
          record_and_run python3 scripts/dashboard_evidence.py validate-semantic \
            candidate/semantic-manifest.json \
            --archive "candidate/tracky-$TARGET.tar.xz" \
            --cargo-dist-manifest candidate/dist-manifest.json
          mkdir extracted
          record_and_run tar -xJf "candidate/tracky-$TARGET.tar.xz" -C extracted
          record_and_run test -x "extracted/tracky-$TARGET/tracky"
          record_and_run env \
            "TRACKY_TEST_BINARY=$PWD/extracted/tracky-$TARGET/tracky" \
            cargo test --locked --test dashboard_cli
          record_and_run python3 scripts/dashboard_candidate_runtime.py \
            --binary "extracted/tracky-$TARGET/tracky" \
            --target "$TARGET" \
            --output runtime-evidence.json
          python3 scripts/release_command_evidence.py \
            --identity expected/release-identity.json \
            --job-type native-runtime \
            --target "$TARGET" \
            --commands-file "$COMMAND_LOG" \
            --output native-runtime-evidence.json
      - name: Retain the verified publication-ready bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-verified-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: |
            candidate/release-identity.json
            candidate/dist-manifest.json
            candidate/semantic-manifest.json
            candidate/native-build-evidence.json
            candidate/tracky-${{ matrix.target }}.tar.xz
            candidate/tracky-${{ matrix.target }}.tar.xz.sha256
            native-runtime-evidence.json
            runtime-evidence.json
          if-no-files-found: error
          retention-days: 14

  browser-current:
    name: Current browser (${{ matrix.lane }})
    needs: [identity, build-native]
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: safari-latest
            runner: macos-latest
            target: aarch64-apple-darwin
            browser: safari
            version: installed
            minimum: '26.0'
          - lane: firefox-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: firefox
            version: latest
            minimum: '153'
          - lane: chromium-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: chromium
            version: stable
            minimum: '150'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-identity-${{ needs.identity.outputs.source_sha }}
          path: expected
      - name: Download the retained native artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: candidate
      - name: Reject identity or artifact substitution
        run: |
          cmp expected/release-identity.json candidate/release-identity.json
          (
            cd candidate
            shasum -a 256 --check "tracky-${{ matrix.target }}.tar.xz.sha256"
          )
          python3 scripts/dashboard_evidence.py validate-semantic \
            candidate/semantic-manifest.json \
            --archive "candidate/tracky-${{ matrix.target }}.tar.xz" \
            --cargo-dist-manifest candidate/dist-manifest.json
      - name: Extract the validated native package
        run: |
          mkdir extracted
          tar -xJf "candidate/tracky-${{ matrix.target }}.tar.xz" -C extracted
          test -x "extracted/tracky-${{ matrix.target }}/tracky"
      - name: Exercise the retained package in the current browser
        uses: ./.github/actions/dashboard-browser-lane
        with:
          artifact-name: release-dry-run-current-browser-${{ needs.identity.outputs.source_sha }}-${{ matrix.lane }}
          binary: extracted/tracky-${{ matrix.target }}/tracky
          browser: ${{ matrix.browser }}
          commit: ${{ needs.identity.outputs.source_sha }}
          lane: ${{ matrix.lane }}
          lockfile-sha256: ${{ needs.identity.outputs.lockfile_sha256 }}
          minimum-version: ${{ matrix.minimum }}
          retention-days: 14
          version: ${{ matrix.version }}

  collect-current-browsers:
    name: Bind current browser evidence
    needs: [identity, browser-current]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Download all current-browser results
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-dry-run-current-browser-${{ needs.identity.outputs.source_sha }}-*
          path: browser-results
          merge-multiple: true
      - name: Assemble exact-identity current-browser evidence
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          LOCKFILE_SHA256: ${{ needs.identity.outputs.lockfile_sha256 }}
        run: |
          python3 scripts/dashboard_browser_evidence.py \
            --results-dir browser-results \
            --commit "$ACCEPTED_SHA" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --profile current \
            --output current-browser-evidence.json
      - name: Retain canonical current-browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-current-browser-evidence-${{ needs.identity.outputs.source_sha }}
          path: |
            current-browser-evidence.json
            browser-results/*.json
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Prove the complete non-publishing dry run
    needs: [identity, quality, package-runtime, collect-current-browsers]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-identity-${{ needs.identity.outputs.source_sha }}
      - name: Download successful quality evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-quality-evidence-${{ needs.identity.outputs.source_sha }}
          path: quality-evidence
      - name: Download both verified native bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-dry-run-verified-${{ needs.identity.outputs.source_sha }}-*
          path: verified
      - name: Download canonical current-browser evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-current-browser-evidence-${{ needs.identity.outputs.source_sha }}
          path: browser-evidence
      - name: Capture same-run workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > workflow-run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            > workflow-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > workflow-artifacts.json
      - name: Assemble complete automated release evidence
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_dry_run_summary.py \
            --verified-root verified \
            --identity release-identity.json \
            --quality-evidence quality-evidence/quality-evidence.json \
            --browser-evidence browser-evidence/current-browser-evidence.json \
            --browser-results browser-evidence/browser-results \
            --workflow-run workflow-run.json \
            --workflow-jobs workflow-jobs.json \
            --workflow-artifacts workflow-artifacts.json \
            --repository "$REPOSITORY" \
            --output release-dry-run-evidence.json \
            --markdown-output release-dry-run-evidence.md
      - name: Retain human-readable and machine-readable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-dry-run-evidence-${{ needs.identity.outputs.source_sha }}
          path: |
            release-dry-run-evidence.json
            release-dry-run-evidence.md
          if-no-files-found: error
          retention-days: 14

  publish-prerelease:
    name: Publish the tested controlled prerelease
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && inputs.prerelease_tag != '' }}
    needs: [identity, summarize]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the accepted source on the trusted default branch
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$ACCEPTED_SHA" "$WORKFLOW_SHA"
      - name: Download the tested native bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-dry-run-verified-${{ needs.identity.outputs.source_sha }}-*
          path: verified
      - name: Download the successful automated evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-dry-run-evidence-${{ needs.identity.outputs.source_sha }}
          path: evidence
      - name: Publish or safely resume the exact retained prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE_TAG: ${{ inputs.prerelease_tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_prerelease.py \
            --repository "$REPOSITORY" \
            --tag "$PRERELEASE_TAG" \
            --verified-root verified \
            --evidence-json evidence/release-dry-run-evidence.json \
            --evidence-markdown evidence/release-dry-run-evidence.md \
            --output release-prerelease-publication.json
      - name: Retain prerelease publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-prerelease-publication-${{ needs.identity.outputs.source_sha }}
          path: release-prerelease-publication.json
          if-no-files-found: error
          retention-days: 14
