name: Release Tracky
run-name: ${{ github.event_name == 'workflow_dispatch' && format('Release Tracky {0}', inputs.accepted_sha) || 'Release Tracky' }}

on:
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact lowercase 40-character source commit SHA on main
        required: true
        type: string
  push:
    branches: [main]
    paths:
      - Cargo.toml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - .github/workflows/homebrew.yml
      - .github/actions/dashboard-browser-lane/action.yml
      - Cargo.lock
      - Cargo.toml
      - scripts/dashboard_candidate_runtime.py
      - scripts/dashboard_browser_evidence.py
      - scripts/dashboard_evidence.py
      - scripts/dashboard_release_browser.py
      - scripts/release_summary.py
      - scripts/release_identity.py
      - scripts/release_trigger.py
      - scripts/release_command_evidence.py
      - scripts/release_homebrew.py
      - scripts/release_publish.py
      - scripts/release_quality_evidence.py
      - scripts/release_slo.py
      - src/dashboard.rs
      - src/dashboard_assets/**
      - src/dashboard_finance.rs
      - src/dashboard_view.rs
      - tests/dashboard_browser_evidence.py
      - tests/release_summary.py
      - tests/release_trigger.py
      - tests/release_command_evidence.py
      - tests/release_homebrew.py
      - tests/release_publish.py
      - tests/release_quality_evidence.py
      - tests/release_slo.py

permissions:
  actions: read
  contents: read

concurrency:
  group: tracky-production-release
  cancel-in-progress: false

jobs:
  identity:
    name: Bind the release identity and target matrix
    runs-on: ubuntu-22.04
    outputs:
      source_sha: ${{ steps.values.outputs.source_sha }}
      package_version: ${{ steps.values.outputs.package_version }}
      lockfile_sha256: ${{ steps.values.outputs.lockfile_sha256 }}
      matrix: ${{ steps.values.outputs.matrix }}
      run_dag: ${{ steps.trigger.outputs.run_dag }}
      publish: ${{ steps.trigger.outputs.publish }}
      reason: ${{ steps.trigger.outputs.reason }}
      tag: ${{ steps.values.outputs.tag }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.accepted_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require manual recovery from a trusted full SHA on main
        if: github.event_name == 'workflow_dispatch'
        env:
          ACCEPTED_SHA: ${{ inputs.accepted_sha }}
        run: |
          [[ "$ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
          git merge-base --is-ancestor "$ACCEPTED_SHA" origin/main
      - name: Record the exact checked-out identity
        run: python3 scripts/release_identity.py --derive --output release-identity.json
      - name: Decide whether this event runs and publishes the DAG
        id: trigger
        env:
          BEFORE_SHA: ${{ github.event.before }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          args=(--event-name "$EVENT_NAME" --github-output "$GITHUB_OUTPUT")
          if test -n "$BEFORE_SHA"; then
            args+=(--before-sha "$BEFORE_SHA")
          fi
          python3 scripts/release_trigger.py "${args[@]}"
      - name: Expose the immutable identity and supported targets
        id: values
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          value = json.load(open("release-identity.json", encoding="utf-8"))
          matrix = {
              "include": [
                  {"runner": "macos-14", "target": "aarch64-apple-darwin"},
                  {"runner": "ubuntu-22.04", "target": "x86_64-unknown-linux-gnu"},
              ]
          }
          print("source_sha=" + value["source_sha"])
          print("package_version=" + value["package_version"])
          print("lockfile_sha256=" + value["lockfile_sha256"])
          print("tag=v" + value["package_version"])
          print("matrix=" + json.dumps(matrix, separators=(",", ":")))
          PY
      - name: Retain the accepted identity
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-identity-${{ steps.values.outputs.source_sha }}
          path: release-identity.json
          if-no-files-found: error
          retention-days: 14

  quality:
    name: Preserved release quality gates
    needs: identity
    if: needs.identity.outputs.run_dag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Install frozen Rust with Clippy and rustfmt
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
          components: clippy, rustfmt
      - id: rust-cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Record the quality cache state
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: |
          state=${CACHE_HIT:-false}
          echo "Rust cache exact hit — quality — $state" >> "$GITHUB_STEP_SUMMARY"
          jq -n --arg job quality --arg exact_hit "$state" \
            '{provider: "Swatinem/rust-cache", job: $job, exact_hit: ($exact_hit == "true")}' \
            > cache-state-quality.json
      - name: Retain the quality cache state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cache-state-${{ needs.identity.outputs.source_sha }}-quality
          path: cache-state-quality.json
          if-no-files-found: error
          retention-days: 14
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-identity-${{ needs.identity.outputs.source_sha }}
      - name: Enforce dependency and license policy
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked
          command-arguments: advisories bans licenses sources
      - name: Run preserved quality gates and record their exact commands
        run: |
          python3 scripts/release_quality_evidence.py \
            --identity release-identity.json \
            --output quality-evidence.json
      - name: Retain successful quality evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-quality-evidence-${{ needs.identity.outputs.source_sha }}
          path: |
            quality-evidence.json
            cache-state-quality.json
          if-no-files-found: error
          retention-days: 14

  build-native:
    name: Build once (${{ matrix.target }})
    needs: identity
    if: needs.identity.outputs.run_dag == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-identity-${{ needs.identity.outputs.source_sha }}
      - name: Install frozen Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
      - id: rust-cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Record the native-build cache state
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit — ${{ matrix.target }} build — ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Install Cargo Dist 0.32.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output cargo-dist-installer.sh \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          echo 'b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  cargo-dist-installer.sh' \
            | shasum -a 256 --check
          sh cargo-dist-installer.sh
      - name: Build once and retain the exact successful commands
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          LOCKFILE_SHA256: ${{ needs.identity.outputs.lockfile_sha256 }}
          PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          COMMAND_LOG="$PWD/native-build-commands.txt"
          : > "$COMMAND_LOG"
          record_and_run() {
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '\n' >> "$COMMAND_LOG"
            "$@"
          }
          record_and_run_to() {
            local output="$1"
            shift
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '> %q\n' "$output" >> "$COMMAND_LOG"
            "$@" > "$output"
          }
          record_and_run dist build --artifacts=local "--target=$TARGET"
          record_and_run_to dist-manifest.json \
            dist manifest --artifacts=local --no-local-paths \
            "--target=$TARGET" --output-format=json
          record_and_run bash -c \
            "cd target/distrib && shasum -a 256 --check 'tracky-$TARGET.tar.xz.sha256'"
          record_and_run python3 scripts/dashboard_evidence.py semantic-manifest \
            --archive "target/distrib/tracky-$TARGET.tar.xz" \
            --target "$TARGET" \
            --source-sha "$ACCEPTED_SHA" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --cargo-dist-manifest dist-manifest.json \
            --package-version "$PACKAGE_VERSION" \
            --rust-version "$(rustc --version)" \
            --cargo-version "$(cargo --version)" \
            --cargo-dist-version "$(dist --version)" \
            --output semantic-manifest.json
          python3 scripts/release_command_evidence.py \
            --identity release-identity.json \
            --job-type native-build \
            --target "$TARGET" \
            --commands-file "$COMMAND_LOG" \
            --output native-build-evidence.json
      - name: Assemble the immutable native bundle
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          TARGET: ${{ matrix.target }}
        run: |
          mkdir release-bundle
          cp release-identity.json dist-manifest.json semantic-manifest.json \
            native-build-evidence.json release-bundle/
          cp "target/distrib/tracky-${{ matrix.target }}.tar.xz" release-bundle/
          cp "target/distrib/tracky-${{ matrix.target }}.tar.xz.sha256" release-bundle/
          jq -n --arg job native-build --arg target "$TARGET" \
            --arg exact_hit "${CACHE_HIT:-false}" \
            '{provider: "Swatinem/rust-cache", job: $job, target: $target,
              exact_hit: ($exact_hit == "true")}' \
            > release-bundle/build-cache-state.json
      - name: Retain the native-build cache state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cache-state-${{ needs.identity.outputs.source_sha }}-build-${{ matrix.target }}
          path: release-bundle/build-cache-state.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain publication-ready native inputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: release-bundle/
          if-no-files-found: error
          retention-days: 14

  package-runtime:
    name: Reuse and test (${{ matrix.target }})
    needs: [identity, build-native]
    if: needs.identity.outputs.run_dag == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.identity.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-identity-${{ needs.identity.outputs.source_sha }}
          path: expected
      - name: Install frozen Rust
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
      - id: rust-cache
        uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Record the package-test cache state
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
        run: echo "Rust cache exact hit — ${{ matrix.target }} test — ${CACHE_HIT:-false}" >> "$GITHUB_STEP_SUMMARY"
      - name: Download the exact built artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: candidate
      - name: Verify and exercise the package with retained exact commands
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          COMMAND_LOG="$PWD/native-runtime-commands.txt"
          : > "$COMMAND_LOG"
          record_and_run() {
            printf '%q ' "$@" >> "$COMMAND_LOG"
            printf '\n' >> "$COMMAND_LOG"
            "$@"
          }
          record_and_run cmp \
            expected/release-identity.json candidate/release-identity.json
          record_and_run bash -c \
            "cd candidate && shasum -a 256 --check 'tracky-$TARGET.tar.xz.sha256'"
          record_and_run python3 scripts/dashboard_evidence.py validate-semantic \
            candidate/semantic-manifest.json \
            --archive "candidate/tracky-$TARGET.tar.xz" \
            --cargo-dist-manifest candidate/dist-manifest.json
          mkdir extracted
          record_and_run tar -xJf "candidate/tracky-$TARGET.tar.xz" -C extracted
          record_and_run test -x "extracted/tracky-$TARGET/tracky"
          record_and_run env \
            "TRACKY_TEST_BINARY=$PWD/extracted/tracky-$TARGET/tracky" \
            cargo test --locked --test dashboard_cli
          record_and_run python3 scripts/dashboard_candidate_runtime.py \
            --binary "extracted/tracky-$TARGET/tracky" \
            --target "$TARGET" \
            --output runtime-evidence.json
          python3 scripts/release_command_evidence.py \
            --identity expected/release-identity.json \
            --job-type native-runtime \
            --target "$TARGET" \
            --commands-file "$COMMAND_LOG" \
            --output native-runtime-evidence.json
      - name: Retain the verified publication-ready bundle
        env:
          CACHE_HIT: ${{ steps.rust-cache.outputs.cache-hit }}
          TARGET: ${{ matrix.target }}
        run: |
          jq -n --arg job package-runtime --arg target "$TARGET" \
            --arg exact_hit "${CACHE_HIT:-false}" \
            '{provider: "Swatinem/rust-cache", job: $job, target: $target,
              exact_hit: ($exact_hit == "true")}' \
            > runtime-cache-state.json
      - name: Retain the package-test cache state
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-cache-state-${{ needs.identity.outputs.source_sha }}-runtime-${{ matrix.target }}
          path: runtime-cache-state.json
          if-no-files-found: error
          retention-days: 14
      - name: Upload the verified publication-ready bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-verified-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: |
            candidate/release-identity.json
            candidate/dist-manifest.json
            candidate/semantic-manifest.json
            candidate/native-build-evidence.json
            candidate/build-cache-state.json
            candidate/tracky-${{ matrix.target }}.tar.xz
            candidate/tracky-${{ matrix.target }}.tar.xz.sha256
            native-runtime-evidence.json
            runtime-evidence.json
            runtime-cache-state.json
          if-no-files-found: error
          retention-days: 14

  browser-current:
    name: Current browser (${{ matrix.lane }})
    needs: [identity, build-native]
    if: needs.identity.outputs.run_dag == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: safari-latest
            runner: macos-latest
            target: aarch64-apple-darwin
            browser: safari
            version: installed
            minimum: '26.0'
          - lane: firefox-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: firefox
            version: latest
            minimum: '153'
          - lane: chromium-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: chromium
            version: stable
            minimum: '150'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Verify the checked-out commit
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-identity-${{ needs.identity.outputs.source_sha }}
          path: expected
      - name: Download the retained native artifact
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-built-${{ needs.identity.outputs.source_sha }}-${{ matrix.target }}
          path: candidate
      - name: Reject identity or artifact substitution
        run: |
          cmp expected/release-identity.json candidate/release-identity.json
          (
            cd candidate
            shasum -a 256 --check "tracky-${{ matrix.target }}.tar.xz.sha256"
          )
          python3 scripts/dashboard_evidence.py validate-semantic \
            candidate/semantic-manifest.json \
            --archive "candidate/tracky-${{ matrix.target }}.tar.xz" \
            --cargo-dist-manifest candidate/dist-manifest.json
      - name: Extract the validated native package
        run: |
          mkdir extracted
          tar -xJf "candidate/tracky-${{ matrix.target }}.tar.xz" -C extracted
          test -x "extracted/tracky-${{ matrix.target }}/tracky"
      - name: Exercise the retained package in the current browser
        uses: ./.github/actions/dashboard-browser-lane
        with:
          artifact-name: release-current-browser-${{ needs.identity.outputs.source_sha }}-${{ matrix.lane }}
          binary: extracted/tracky-${{ matrix.target }}/tracky
          browser: ${{ matrix.browser }}
          commit: ${{ needs.identity.outputs.source_sha }}
          lane: ${{ matrix.lane }}
          lockfile-sha256: ${{ needs.identity.outputs.lockfile_sha256 }}
          minimum-version: ${{ matrix.minimum }}
          retention-days: 14
          version: ${{ matrix.version }}

  collect-current-browsers:
    name: Bind current browser evidence
    needs: [identity, browser-current]
    if: needs.identity.outputs.run_dag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Download all current-browser results
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-current-browser-${{ needs.identity.outputs.source_sha }}-*
          path: browser-results
          merge-multiple: true
      - name: Assemble exact-identity current-browser evidence
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          LOCKFILE_SHA256: ${{ needs.identity.outputs.lockfile_sha256 }}
        run: |
          python3 scripts/dashboard_browser_evidence.py \
            --results-dir browser-results \
            --commit "$ACCEPTED_SHA" \
            --lockfile-sha256 "$LOCKFILE_SHA256" \
            --profile current \
            --output current-browser-evidence.json
      - name: Retain canonical current-browser evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-current-browser-evidence-${{ needs.identity.outputs.source_sha }}
          path: |
            current-browser-evidence.json
            browser-results/*.json
          if-no-files-found: error
          retention-days: 14

  summarize:
    name: Prove the complete pre-publication release
    needs: [identity, quality, package-runtime, collect-current-browsers]
    if: needs.identity.outputs.run_dag == 'true'
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Download the accepted identity
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-identity-${{ needs.identity.outputs.source_sha }}
      - name: Download successful quality evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-quality-evidence-${{ needs.identity.outputs.source_sha }}
          path: quality-evidence
      - name: Download both verified native bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-verified-${{ needs.identity.outputs.source_sha }}-*
          path: verified
      - name: Download canonical current-browser evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-current-browser-evidence-${{ needs.identity.outputs.source_sha }}
          path: browser-evidence
      - name: Capture same-run workflow metadata
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > workflow-run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            > workflow-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > workflow-artifacts.json
      - name: Assemble complete automated release evidence
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/release_summary.py \
            --verified-root verified \
            --identity release-identity.json \
            --quality-evidence quality-evidence/quality-evidence.json \
            --browser-evidence browser-evidence/current-browser-evidence.json \
            --browser-results browser-evidence/browser-results \
            --workflow-run workflow-run.json \
            --workflow-jobs workflow-jobs.json \
            --workflow-artifacts workflow-artifacts.json \
            --repository "$REPOSITORY" \
            --output release-evidence.json \
            --markdown-output release-evidence.md
      - name: Retain human-readable and machine-readable release evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-evidence-${{ needs.identity.outputs.source_sha }}
          path: |
            release-evidence.json
            release-evidence.md
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish the tested stable release
    if: needs.identity.outputs.publish == 'true'
    needs: [identity, summarize]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: write
    outputs:
      release_url: ${{ steps.publish.outputs.release_url }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require the accepted source on the trusted default branch
        env:
          ACCEPTED_SHA: ${{ needs.identity.outputs.source_sha }}
          WORKFLOW_SHA: ${{ github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$WORKFLOW_SHA"
          git merge-base --is-ancestor "$ACCEPTED_SHA" "$WORKFLOW_SHA"
      - name: Download the tested native bundles
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-verified-${{ needs.identity.outputs.source_sha }}-*
          path: verified
      - name: Download the successful automated evidence
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: release-evidence-${{ needs.identity.outputs.source_sha }}
          path: evidence
      - name: Publish or safely resume the exact retained release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ needs.identity.outputs.tag }}
        run: |
          python3 scripts/release_publish.py \
            --repository "$REPOSITORY" \
            --tag "$TAG" \
            --verified-root verified \
            --evidence-json evidence/release-evidence.json \
            --evidence-markdown evidence/release-evidence.md \
            --output release-publication.json
          echo "release_url=$(jq -r .release_url release-publication.json)" >> "$GITHUB_OUTPUT"
      - name: Retain release publication evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-publication-${{ needs.identity.outputs.source_sha }}
          path: release-publication.json
          if-no-files-found: error
          retention-days: 14

  publish-homebrew:
    name: Validate and publish Homebrew after release hosting
    if: needs.identity.outputs.publish == 'true'
    needs: [identity, publish-release]
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/homebrew.yml
    with:
      tag: ${{ needs.identity.outputs.tag }}
      source_sha: ${{ needs.identity.outputs.source_sha }}
      package_version: ${{ needs.identity.outputs.package_version }}

  final-summary:
    name: Record publication URLs and release latency
    if: needs.identity.outputs.publish == 'true'
    needs: [identity, publish-release, publish-homebrew]
    runs-on: ubuntu-22.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009ac4c25cc4861a3631e0b # v6
        with:
          ref: ${{ needs.identity.outputs.source_sha }}
          persist-credentials: false
      - name: Capture final same-run timings and artifact identities
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > workflow-run.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" \
            > workflow-jobs.json
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID/artifacts?per_page=100" \
            > workflow-artifacts.json
          gh api "repos/$GH_REPO/actions/workflows/release.yml/runs?status=success&per_page=100" \
            > workflow-history.json
          gh api "repos/$GH_REPO/releases?per_page=100" > releases.json
      - name: Download retained cache states
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: release-cache-state-*
          path: retained
      - name: Assess the release-latency SLO when enough history exists
        run: |
          python3 scripts/release_slo.py \
            --workflow-history workflow-history.json \
            --releases releases.json \
            --current-run workflow-run.json \
            --current-jobs workflow-jobs.json \
            --current-source '${{ needs.identity.outputs.source_sha }}' \
            --output release-slo.json
      - name: Render the final production summary
        env:
          PACKAGE_VERSION: ${{ needs.identity.outputs.package_version }}
          RELEASE_URL: ${{ needs.publish-release.outputs.release_url }}
          SOURCE_SHA: ${{ needs.identity.outputs.source_sha }}
          TAG: ${{ needs.identity.outputs.tag }}
          TAP_ACTION: ${{ needs.publish-homebrew.outputs.action }}
          TAP_COMMIT: ${{ needs.publish-homebrew.outputs.tap_commit }}
        run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from datetime import datetime

          run = json.load(open("workflow-run.json", encoding="utf-8"))
          jobs = json.load(open("workflow-jobs.json", encoding="utf-8"))["jobs"]
          artifacts = json.load(open("workflow-artifacts.json", encoding="utf-8"))["artifacts"]
          slo = json.load(open("release-slo.json", encoding="utf-8"))
          parse = lambda value: datetime.fromisoformat(value.replace("Z", "+00:00"))
          queued = (parse(run["run_started_at"]) - parse(run["created_at"])).total_seconds()
          print("# Tracky production release")
          print()
          print("- Source: `{}`".format(os.environ["SOURCE_SHA"]))
          print("- Version/tag: `{}` / `{}`".format(os.environ["PACKAGE_VERSION"], os.environ["TAG"]))
          print("- GitHub Release: {}".format(os.environ["RELEASE_URL"]))
          print("- Homebrew tap: https://github.com/yersonargotev/homebrew-tap/commit/{} (`{}`)".format(
              os.environ["TAP_COMMIT"], os.environ["TAP_ACTION"]))
          print("- Workflow queue: `{:.3f}s`".format(queued))
          if not slo["assessed"]:
              print("- SLO history: `{}/10` unified production releases; p50/p95 assessment deferred.".format(
                  slo["sample_count"]))
          else:
              status = slo["status"].replace("-", " ")
              print("- Release SLO: {} over `{}` runs; p50 `{:.3f}s`, p95 `{:.3f}s` (target 600–900s).".format(
                  status, slo["sample_count"], slo["p50_seconds"], slo["p95_seconds"]))
          print()
          print("## Cache state")
          cache_paths = sorted(__import__("pathlib").Path("retained").rglob("*cache-state*.json"))
          for path in cache_paths:
              value = json.load(path.open(encoding="utf-8"))
              label = value["job"] + (" / " + value["target"] if value.get("target") else "")
              print("- {}: exact hit `{}`".format(label, str(value["exact_hit"]).lower()))
          print()
          print("## Job timing")
          for job in sorted(jobs, key=lambda item: item["name"]):
              if job.get("started_at") and job.get("completed_at"):
                  duration = (parse(job["completed_at"]) - parse(job["started_at"])).total_seconds()
                  print("- [{}]({}): `{:.3f}s`".format(job["name"], job["html_url"], duration))
          print()
          print("## Retained artifacts")
          for artifact in sorted(artifacts, key=lambda item: item["name"]):
              print("- `{}` — id `{}`, digest `{}`".format(
                  artifact["name"], artifact["id"], artifact.get("digest", "unavailable")))
          PY
