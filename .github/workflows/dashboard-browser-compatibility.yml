name: Test full dashboard browser compatibility

on:
  schedule:
    - cron: '23 7 * * 1'
  workflow_dispatch:
    inputs:
      accepted_sha:
        description: Exact lowercase 40-character source commit SHA
        required: true
        type: string
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/dashboard-browser-compatibility.yml
      - .github/workflows/release.yml
      - .github/actions/dashboard-browser-lane/action.yml
      - Cargo.lock
      - Cargo.toml
      - scripts/dashboard_browser_evidence.py
      - scripts/dashboard_release_browser.py
      - src/dashboard.rs
      - src/dashboard_assets/**
      - src/dashboard_finance.rs
      - src/dashboard_view.rs
      - tests/dashboard_browser_evidence.py

permissions:
  contents: read

env:
  ACCEPTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.accepted_sha || github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

concurrency:
  group: dashboard-browser-compatibility-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-package:
    name: Package browser test input (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            target: aarch64-apple-darwin
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Validate the accepted commit SHA
        shell: bash
        run: |
          if [[ ! "$ACCEPTED_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "accepted_sha must be exactly 40 lowercase hexadecimal characters" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.ACCEPTED_SHA }}
          persist-credentials: false
      - name: Verify the checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Install the frozen Rust toolchain
        uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: 1.93.0
      - name: Install Cargo Dist 0.32.0
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf \
            --output cargo-dist-installer.sh \
            https://github.com/axodotdev/cargo-dist/releases/download/v0.32.0/cargo-dist-installer.sh
          echo 'b657cf8c04a8b7bc28f39d220f7e6dd11bbd2bdb072c552262bd9ccf597261b5  cargo-dist-installer.sh' \
            | shasum -a 256 --check
          sh cargo-dist-installer.sh
      - name: Build the packaged browser test input
        run: dist build --artifacts=local --target=${{ matrix.target }} --output-format=json
      - name: Retain the packaged browser input
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-browser-package-${{ env.ACCEPTED_SHA }}-${{ matrix.target }}
          path: |
            target/distrib/tracky-${{ matrix.target }}.tar.xz
            target/distrib/tracky-${{ matrix.target }}.tar.xz.sha256
          if-no-files-found: error
          retention-days: 90

  browser-lane:
    name: Browser lane (${{ matrix.lane }})
    needs: build-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: safari-minimum
            runner: macos-26
            target: aarch64-apple-darwin
            browser: safari
            version: installed
            minimum: '26.0'
          - lane: safari-latest
            runner: macos-latest
            target: aarch64-apple-darwin
            browser: safari
            version: installed
            minimum: '26.0'
          - lane: firefox-esr-minimum
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: firefox
            version: 153.0esr
            minimum: '153'
          - lane: firefox-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: firefox
            version: latest
            minimum: '153'
          - lane: chromium-minimum
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: chromium
            version: '150'
            minimum: '150'
          - lane: chromium-latest
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            browser: chromium
            version: stable
            minimum: '150'
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.ACCEPTED_SHA }}
          persist-credentials: false
      - name: Verify the checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download the packaged browser input
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          name: dashboard-browser-package-${{ env.ACCEPTED_SHA }}-${{ matrix.target }}
          path: package
      - name: Extract the packaged browser input
        shell: bash
        run: |
          (cd package && shasum -a 256 --check "tracky-${{ matrix.target }}.tar.xz.sha256")
          tar -xJf "package/tracky-${{ matrix.target }}.tar.xz" -C package
          test -x "package/tracky-${{ matrix.target }}/tracky"
      - name: Bind the raw lockfile digest
        id: lockfile
        shell: bash
        run: echo "sha256=$(shasum -a 256 Cargo.lock | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Exercise the real packaged browser lane
        uses: ./.github/actions/dashboard-browser-lane
        with:
          artifact-name: dashboard-browser-lane-${{ env.ACCEPTED_SHA }}-${{ matrix.lane }}
          binary: package/tracky-${{ matrix.target }}/tracky
          browser: ${{ matrix.browser }}
          commit: ${{ env.ACCEPTED_SHA }}
          lane: ${{ matrix.lane }}
          lockfile-sha256: ${{ steps.lockfile.outputs.sha256 }}
          minimum-version: ${{ matrix.minimum }}
          retention-days: 90
          version: ${{ matrix.version }}

  collect:
    name: Assemble canonical browser evidence
    needs: browser-lane
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ env.ACCEPTED_SHA }}
          persist-credentials: false
      - name: Verify the checked-out commit
        shell: bash
        run: test "$(git rev-parse HEAD)" = "$ACCEPTED_SHA"
      - name: Download all raw browser results
        uses: actions/download-artifact@484a0b528fb4d7bd804637ccb632e47a0e638317 # v8
        with:
          pattern: dashboard-browser-lane-${{ env.ACCEPTED_SHA }}-*
          path: browser-results
          merge-multiple: true
      - name: Assemble the exact-SHA canonical browser input
        run: |
          lockfile_sha256=$(sha256sum Cargo.lock | cut -d ' ' -f 1)
          python3 scripts/dashboard_browser_evidence.py \
            --results-dir browser-results \
            --commit "$ACCEPTED_SHA" \
            --lockfile-sha256 "$lockfile_sha256" \
            --output browsers.json
      - name: Retain canonical browser evidence and raw results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dashboard-browser-evidence-${{ env.ACCEPTED_SHA }}
          path: |
            browsers.json
            browser-results/*.json
          if-no-files-found: error
          retention-days: 90
